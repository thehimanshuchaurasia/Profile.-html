<!DOCTYPE html>
<html lang = "en">
  <head>
    <meta charset="utf-8">
    <meta name= "viewport" content= "width =device-width, intial-scale=1.0">
    <title>Profile card</title> 
    <style>
      body{
        margin: 0;
        padding: 0;
        font-family:Arial, Helvetica, sans-serif ;
        background-color: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        
      }
      .card{
        background-color:#ffffff;
        width: 280px;
        padding: 24px;
        border-radius: 14px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);

        text-align: center;
        
      }
      .Profile-image{
        width: 100px;
        height: 100px;
        border-radius:50%;
        object-fit: cover;
        border:3px solid #000000;
      }
      .name{
        margin: 14px 0 4px 0;
        font-size: 20px ;
        color: #111111;
      }
          .role{
            margin: 0 0 12px 0 ;
            font-size: 14px;
            color:#000499;
            font-weight: 600 ;
          }
      .bio{
        font-size: 13px;
        color: #666666;
        line-height: 1.5;
        margin-bottom: 12px;
      }
      .followers{
        font-size: 14px;
        font-weight: bold;
        color: #555555;
        margin-bottom: 20px;
        
      }
      
      #count{
      
        color: #991122;
        
      }
        .btn{
          background-color:#007bff;
          color: #ffffff;
          border: none;
          padding: 10px 24px;
          font-size: 14px;
          font-weight: bold;
          border-radius: 20px;
          cursor: pointer;
        }
      
      </style>
    
  </head>
<body>
<div class="card">
  <img src="https://github.com/thehimanshuchaurasia.png" alt="Himanshu Chaurasia" style="width: 150px; height: 150px; border-radius: 50%; object-fit: cover;">

  <h2 class="name">Himanshu Chaurasia</h2>
  <p class="role"> Frontent developer</p>
  <p class="bio">Learning web devlopment step by step. Passionate about coding and building clean UIs</p>
  <p class="followers">followers:<span id="count">100 </span></p>
  <button class="btn" id="connectbtn">connect</button>
</div>
<script>
  const btn=document.getElementById("connectbtn");
  const countElement=document.getElementById("count");
  let followers=100;
  btn.addEventListener("click",function(){
    if (btn.innerText==="connect"){
      btn.innerText= "connected✓";
    btn.style.background="#029911";
    followers=followers + 1;
    countElement.innerText=followers;
    
    } else{
      btn.innerText="connect";
      btn.style.background="#0404cc";
      followers=followers -1 ;
      countElement.innerText=followers;
    }
  });
</script>
</body>
</html>
